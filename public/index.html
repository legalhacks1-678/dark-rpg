<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Elder Scrolls: Skyrim Web RPG</title>
    <style>
        * { touch-action: manipulation; user-select: none; box-sizing: border-box; }
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Cinzel', serif, sans-serif; color: #e0e0e0; }
        #canvas3d { width: 100vw; height: 100vh; display: block; }

        /* Crosshair for PC Pointer Lock */
        #crosshair { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 8px; height: 8px; border: 2px solid rgba(255,255,255,0.7); border-radius: 50%; pointer-events: none; z-index: 5; }

        /* HUD */
        #hud { position: fixed; top: 15px; left: 15px; background: rgba(10,10,12,0.85); padding: 14px; border-radius: 4px; border: 1px solid #7c6d53; z-index: 10; font-size: 13px; min-width: 190px; }
        .bar { width: 100%; height: 8px; background: #222; margin: 3px 0 6px 0; border: 1px solid #555; }
        #hpFill { width: 100%; height: 100%; background: #991b1b; }
        
        #infectionAlert { display: none; margin-top: 6px; padding: 4px; background: #581c87; color: #f3e8ff; border: 1px solid #c084fc; font-size: 11px; text-align: center; }

        /* Modals (Inventory, Crafting, Settings) */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 100; align-items: center; justify-content: center; }
        .window { background: #16161a; border: 2px solid #854d0e; padding: 25px; border-radius: 8px; width: 90%; max-width: 440px; max-height: 85vh; overflow-y: auto; color: #fff; }
        .window h2 { margin-top: 0; color: #facc15; border-bottom: 1px solid #854d0e; padding-bottom: 6px; }
        
        button.game-btn { background: #27272a; border: 1px solid #71717a; color: white; padding: 8px 12px; margin: 5px 0; width: 100%; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button.game-btn:hover { background: #3f3f46; border-color: #facc15; }

        /* Top Nav Icons */
        #topNav { position: fixed; top: 15px; right: 15px; display: flex; gap: 8px; z-index: 10; }
        .icon-btn { background: rgba(0,0,0,0.75); border: 1px solid #7c6d53; color: white; width: 42px; height: 42px; border-radius: 4px; font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        /* Mobile Controls */
        #mobileControls { display: none; position: fixed; inset: 0; pointer-events: none; z-index: 10; }
        #dpad { position: absolute; bottom: 25px; left: 25px; display: grid; grid-template-columns: 55px 55px 55px; grid-template-rows: 55px 55px; gap: 6px; pointer-events: auto; }
        .t-btn { background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.4); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: white; }
        #btnUp { grid-column: 2; grid-row: 1; } #btnLeft { grid-column: 1; grid-row: 2; } #btnDown { grid-column: 2; grid-row: 2; } #btnRight { grid-column: 3; grid-row: 2; }
        
        #actionCluster { position: absolute; bottom: 25px; right: 25px; display: flex; flex-direction: column; gap: 10px; pointer-events: auto; }
        .act-btn { width: 65px; height: 65px; border-radius: 50%; border: 2px solid #ca8a04; background: rgba(0,0,0,0.7); color: white; font-weight: bold; font-size: 13px; display: flex; align-items: center; justify-content: center; }

        #promptText { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); padding: 8px 16px; border: 1px solid #eab308; display: none; z-index: 10; font-size: 14px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <div id="crosshair"></div>
    <div id="promptText">Press [F] or Tap to Interact</div>

    <!-- HUD -->
    <div id="hud">
        <div id="hudName" style="font-weight:bold; color:#facc15;">Dragonborn</div>
        <div id="hudTrait" style="color:#a8a29e;">Form: Human</div>
        <div>HP</div><div class="bar"><div id="hpFill"></div></div>
        <div id="hudTime">Skyrim Time: Day ☀️</div>
        <div id="infectionAlert">⚠️ Blood Sickness: Surviving (45s)...</div>
    </div>

    <!-- Top Navigation Icons -->
    <div id="topNav">
        <div class="icon-btn" onclick="toggleModal('invModal')">🎒</div>
        <div class="icon-btn" onclick="toggleModal('craftModal')">⚒️</div>
        <div class="icon-btn" onclick="toggleModal('settingsModal')">⚙️</div>
    </div>

    <!-- Inventory Modal -->
    <div id="invModal" class="modal">
        <div class="window">
            <h2>Inventory</h2>
            <div id="invList" style="line-height: 1.8;"></div>
            <button class="game-btn" onclick="toggleModal('invModal')">Close</button>
        </div>
    </div>

    <!-- Crafting Modal -->
    <div id="craftModal" class="modal">
        <div class="window">
            <h2>Blacksmith & Alchemy</h2>
            <button class="game-btn" onclick="craft('iron_sword')">Forge Iron Greatsword (3x Iron)</button>
            <button class="game-btn" onclick="craft('wolf_armor')">Stitch Wolf Armor (3x Wolf Pelt)</button>
            <button class="game-btn" onclick="craft('sun_potion')">Brew Sun-Ward Draught (1x Dust, 2x Herbs)</button>
            <button class="game-btn" style="margin-top:15px;" onclick="toggleModal('craftModal')">Close</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal">
        <div class="window">
            <h2>Settings</h2>
            <label>Mouse Look Sensitivity:</label>
            <input type="range" id="mouseSens" min="1" max="10" value="3" style="width:100%; margin:8px 0 15px 0;">
            <h3>Key Bindings</h3>
            <div style="font-size:12px; color:#aaa; margin-bottom:10px;">Click input to rebind:</div>
            <div id="keybindList"></div>
            <button class="game-btn" style="margin-top:15px;" onclick="toggleModal('settingsModal')">Save & Close</button>
        </div>
    </div>

    <!-- Mobile Touch Controls -->
    <div id="mobileControls">
        <div id="dpad">
            <div class="t-btn" id="btnUp">▲</div>
            <div class="t-btn" id="btnLeft">◀</div>
            <div class="t-btn" id="btnDown">▼</div>
            <div class="t-btn" id="btnRight">▶</div>
        </div>
        <div id="actionCluster">
            <div class="act-btn" id="btnAtk">STRIKE</div>
            <div class="act-btn" id="btnMine" style="border-color:#38bdf8;">MINE</div>
        </div>
    </div>

    <div id="canvas3d"></div>

    <script>
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || ('ontouchstart' in window);
        if (isMobile) {
            document.getElementById('mobileControls').style.display = 'block';
        } else {
            document.getElementById('crosshair').style.display = 'block';
        }

        const socket = io();
        let myId = null, myData = null, serverEnemies = [];
        const playerMeshes = {}, enemyMeshes = {};

        // Keybindings (Customizable)
        let keybinds = JSON.parse(localStorage.getItem('skyrim_keys')) || {
            forward: 'w', backward: 's', left: 'a', right: 'd',
            attack: 'f', inventory: 'i', craft: 'c'
        };

        function renderKeybinds() {
            const container = document.getElementById('keybindList');
            container.innerHTML = '';
            for (let action in keybinds) {
                const row = document.createElement('div');
                row.style.display = 'flex'; row.style.justifyContent = 'space-between'; row.style.margin = '4px 0';
                row.innerHTML = `<span>${action.toUpperCase()}:</span><button style="width:70px; background:#333; color:#fff;" onclick="rebindKey('${action}')">${keybinds[action].toUpperCase()}</button>`;
                container.appendChild(row);
            }
        }
        renderKeybinds();

        function rebindKey(action) {
            const newKey = prompt(`Press new key for ${action.toUpperCase()}:`);
            if (newKey) {
                keybinds[action] = newKey.toLowerCase();
                localStorage.setItem('skyrim_keys', JSON.stringify(keybinds));
                renderKeybinds();
            }
        }

        function toggleModal(id) {
            const m = document.getElementById(id);
            m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
        }

        // Three.js Skyrim Landscape
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.012);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 500);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas3d').appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6); scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xfff7ed, 0.9); sunLight.position.set(50, 100, 50); scene.add(sunLight);

        // Procedural Mountains & Valleys Heightmap
        const terrainGeo = new THREE.PlaneGeometry(350, 350, 64, 64);
        terrainGeo.rotateX(-Math.PI / 2);
        const pos = terrainGeo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
            const x = pos.getX(i);
            const z = pos.getZ(i);
            // High perimeter mountains, rolling interior
            let distFromCenter = Math.sqrt(x*x + z*z);
            let height = Math.sin(x * 0.05) * Math.cos(z * 0.05) * 4;
            if (distFromCenter > 70) {
                height += Math.pow((distFromCenter - 70) * 0.25, 1.6); // Mountain Wall
            }
            pos.setY(i, height);
        }
        terrainGeo.computeVertexNormals();
        const terrainMat = new THREE.MeshLambertMaterial({ color: 0x2e4a23 });
        const terrain = new THREE.Mesh(terrainGeo, terrainMat);
        scene.add(terrain);

        // Skyrim Deep Cave Cavern (x: -50, z: -50)
        const caveEntrance = new THREE.Group();
        const arch = new THREE.Mesh(new THREE.TorusGeometry(6, 2.5, 8, 16, Math.PI), new THREE.MeshLambertMaterial({ color: 0x1c1917 }));
        arch.position.set(-50, 2, -50); arch.rotation.y = Math.PI / 4;
        const caveLight = new THREE.PointLight(0xf97316, 2, 25); caveLight.position.set(-50, 3, -50);
        caveEntrance.add(arch, caveLight);
        scene.add(caveEntrance);

        // Resource Veins (Iron Mine x: 10, z: 10)
        const ironVein = new THREE.Mesh(new THREE.DodecahedronGeometry(1.2), new THREE.MeshLambertMaterial({ color: 0x71717a }));
        ironVein.position.set(10, 0.8, 10); scene.add(ironVein);

        // Enemy Mesh Generator
        function buildEnemyMesh(e) {
            const g = new THREE.Group();
            let color = e.type === 'vampire' ? 0x7f1d1d : (e.type === 'werewolf' ? 0x451a03 : 0x3f3f46);
            let size = e.type === 'werewolf' ? 1.6 : 1.2;
            const body = new THREE.Mesh(new THREE.BoxGeometry(size, size*1.5, size), new THREE.MeshLambertMaterial({ color }));
            body.position.y = (size*1.5)/2;
            g.add(body);
            g.position.set(e.x, 0, e.z);
            scene.add(g);
            return g;
        }

        // Network Setup
        socket.on('init', (data) => {
            myId = data.id; myData = data.players[myId]; serverEnemies = data.enemies;
            serverEnemies.forEach(e => enemyMeshes[e.id] = buildEnemyMesh(e));
            socket.emit('joinGame', { characterClass: 'Warrior' });
            updateHUD();
        });

        socket.on('enemyUpdated', (e) => {
            const idx = serverEnemies.findIndex(x => x.id === e.id);
            if (idx !== -1) serverEnemies[idx] = e;
            if (enemyMeshes[e.id]) {
                enemyMeshes[e.id].visible = e.hp > 0;
            }
        });

        socket.on('infectionContracted', ({ type, duration }) => {
            const alert = document.getElementById('infectionAlert');
            alert.style.display = 'block';
            alert.innerText = `☣️ Contracted ${type} Sickness! Survive ${duration}s without dying to turn!`;
        });

        socket.on('transformed', (trait) => {
            document.getElementById('infectionAlert').style.display = 'none';
            alert(`🔥 THE TRANSFORMATION COMPLETE! You are now a ${trait}!`);
        });

        socket.on('playerDied', (msg) => { alert(msg); document.getElementById('infectionAlert').style.display = 'none'; });
        socket.on('lootReceived', (msg) => alert(msg));

        socket.on('playerUpdated', (p) => {
            if (p.id === myId) {
                myData = p;
                updateHUD();
                renderInventory();
            }
        });

        function updateHUD() {
            if (!myData) return;
            document.getElementById('hudName').innerText = `Dovahkiin (Lv.${myData.level})`;
            document.getElementById('hudTrait').innerText = `Form: ${myData.trait}`;
            document.getElementById('hpFill').style.width = (myData.hp / myData.maxHp * 100) + '%';
        }

        function renderInventory() {
            const list = document.getElementById('invList');
            list.innerHTML = '';
            for (let item in myData.inventory) {
                if (myData.inventory[item] > 0) {
                    list.innerHTML += `<div>• ${item.replace('_',' ').toUpperCase()}: <b>${myData.inventory[item]}</b></div>`;
                }
            }
        }

        function craft(recipe) { socket.emit('craftItem', recipe); }

        // Interaction (Attack / Mine)
        function checkInteractions() {
            if (!myData) return;
            // Check ore mining
            const dOre = Math.hypot(camera.position.x - 10, camera.position.z - 10);
            if (dOre < 4) {
                document.getElementById('promptText').style.display = 'block';
                document.getElementById('promptText').innerText = `Press [${keybinds.attack.toUpperCase()}] to Mine Iron`;
                return;
            }
            // Check enemies nearby
            let nearEnemy = serverEnemies.find(e => e.hp > 0 && Math.hypot(camera.position.x - e.x, camera.position.z - e.z) < 5);
            if (nearEnemy) {
                document.getElementById('promptText').style.display = 'block';
                document.getElementById('promptText').innerText = `Press [${keybinds.attack.toUpperCase()}] to Strike ${nearEnemy.name} (${nearEnemy.hp} HP)`;
                return;
            }
            document.getElementById('promptText').style.display = 'none';
        }

        function executeAction() {
            // Mine
            if (Math.hypot(camera.position.x - 10, camera.position.z - 10) < 4) {
                socket.emit('gatherResource', 'iron_ore');
                return;
            }
            // Attack nearest enemy
            let nearEnemy = serverEnemies.find(e => e.hp > 0 && Math.hypot(camera.position.x - e.x, camera.position.z - e.z) < 5);
            if (nearEnemy) {
                socket.emit('attackEnemy', nearEnemy.id);
            }
        }

        // Pointer Lock (Mouse Sensitivity) on PC
        if (!isMobile) {
            document.body.addEventListener('click', () => { document.body.requestPointerLock(); });
            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === document.body) {
                    const sens = parseFloat(document.getElementById('mouseSens').value) * 0.0008;
                    camera.rotation.y -= e.movementX * sens;
                }
            });
        }

        // Controls
        let keys = { w: false, s: false, a: false, d: false };
        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            if (k === keybinds.forward) keys.w = true;
            if (k === keybinds.backward) keys.s = true;
            if (k === keybinds.left) keys.a = true;
            if (k === keybinds.right) keys.d = true;
            if (k === keybinds.attack) executeAction();
            if (k === keybinds.inventory) toggleModal('invModal');
            if (k === keybinds.craft) toggleModal('craftModal');
        });
        window.addEventListener('keyup', (e) => {
            const k = e.key.toLowerCase();
            if (k === keybinds.forward) keys.w = false;
            if (k === keybinds.backward) keys.s = false;
            if (k === keybinds.left) keys.a = false;
            if (k === keybinds.right) keys.d = false;
        });

        // Touch Bindings for Mobile
        function bindTouch(id, k) {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[k] = true; });
            el.addEventListener('touchend', (e) => { e.preventDefault(); keys[k] = false; });
        }
        bindTouch('btnUp', 'w'); bindTouch('btnDown', 's'); bindTouch('btnLeft', 'a'); bindTouch('btnRight', 'd');
        document.getElementById('btnAtk').onclick = executeAction;
        document.getElementById('btnMine').onclick = () => socket.emit('gatherResource', 'iron_ore');

        // Loop
        camera.position.set(0, 3, 15);
        function animate() {
            requestAnimationFrame(animate);

            let moved = false;
            if (keys.w) { camera.position.x -= Math.sin(camera.rotation.y) * 0.16; camera.position.z -= Math.cos(camera.rotation.y) * 0.16; moved = true; }
            if (keys.s) { camera.position.x += Math.sin(camera.rotation.y) * 0.12; camera.position.z += Math.cos(camera.rotation.y) * 0.12; moved = true; }
            if (keys.a) { camera.position.x -= Math.cos(camera.rotation.y) * 0.12; camera.position.z += Math.sin(camera.rotation.y) * 0.12; moved = true; }
            if (keys.d) { camera.position.x += Math.cos(camera.rotation.y) * 0.12; camera.position.z -= Math.sin(camera.rotation.y) * 0.12; moved = true; }

            if (moved) {
                checkInteractions();
                socket.emit('move', { x: camera.position.x, z: camera.position.z, rotation: camera.rotation.y });
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
