<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Open-World Action RPG</title>
    <style>
        * { touch-action: manipulation; user-select: none; box-sizing: border-box; }
        body { margin: 0; overflow: hidden; background: #050505; font-family: 'Courier New', monospace; color: white; }
        #canvas3d { width: 100vw; height: 100vh; display: block; }

        /* UI Overlays */
        #updateBanner { display: none; position: fixed; top: 0; left: 0; right: 0; background: #ff9800; color: #000; font-weight: bold; text-align: center; padding: 10px; z-index: 9999; cursor: pointer; }
        
        #hud { position: fixed; top: 15px; left: 15px; background: rgba(0,0,0,0.75); padding: 12px; border-radius: 6px; border: 2px solid #444; z-index: 10; font-size: 13px; line-height: 1.5; pointer-events: none; }
        .bar { width: 140px; height: 10px; background: #333; margin: 4px 0 8px 0; border: 1px solid #777; border-radius: 2px; }
        #hpFill { width: 100%; height: 100%; background: #e53935; }
        #staFill { width: 100%; height: 100%; background: #43a047; }

        #bossHud { position: fixed; top: 15px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); padding: 10px 20px; border-radius: 8px; border: 2px solid #b71c1c; text-align: center; z-index: 10; min-width: 280px; }
        #bossHpBar { width: 100%; height: 12px; background: #333; margin-top: 6px; border: 1px solid #777; }
        #bossHpFill { width: 100%; height: 100%; background: #d32f2f; transition: width 0.2s; }

        /* Telegraph Banner */
        #telegraphBanner { display: none; position: fixed; top: 85px; left: 50%; transform: translateX(-50%); padding: 10px 24px; border-radius: 8px; font-weight: bold; font-size: 16px; z-index: 20; text-transform: uppercase; letter-spacing: 1px; animation: pulse 0.3s infinite alternate; }
        @keyframes pulse { from { transform: translateX(-50%) scale(1); } to { transform: translateX(-50%) scale(1.08); } }

        /* Character Creation Modal */
        #charModal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; align-items: center; justify-content: center; z-index: 100; }
        .box { background: #1a1a1a; padding: 25px; border: 2px solid #666; border-radius: 10px; max-width: 360px; width: 90%; text-align: center; }
        select, button { width: 100%; padding: 10px; margin: 8px 0; background: #2a2a2a; color: white; border: 1px solid #555; border-radius: 4px; font-size: 15px; }
        button.play-btn { background: #2e7d32; font-weight: bold; cursor: pointer; margin-top: 15px; }

        /* Controls (Mobile) */
        #dpad { position: fixed; bottom: 20px; left: 20px; display: grid; grid-template-columns: 55px 55px 55px; grid-template-rows: 55px 55px; gap: 8px; z-index: 10; }
        .t-btn { background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.4); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: white; }
        #btnUp { grid-column: 2; grid-row: 1; } #btnLeft { grid-column: 1; grid-row: 2; } #btnDown { grid-column: 2; grid-row: 2; } #btnRight { grid-column: 3; grid-row: 2; }

        #actionCluster { position: fixed; bottom: 20px; right: 20px; display: grid; grid-template-columns: 60px 60px; grid-template-rows: 60px 60px; gap: 10px; z-index: 10; }
        .act-btn { border-radius: 50%; border: 2px solid #fff; font-weight: bold; font-size: 12px; display: flex; align-items: center; justify-content: center; color: white; }
        #btnAttack { background: #c62828; }
        #btnParry { background: #1565c0; }
        #btnDodge { background: #f57f17; }
        #btnTech { background: #6a1b9a; }
        #btnCam { position: fixed; top: 15px; right: 15px; width: 45px; height: 45px; border-radius: 8px; background: rgba(0,0,0,0.6); border: 1px solid #777; color: white; z-index: 10; font-size: 18px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <div id="updateBanner" onclick="window.location.reload()">⚡ New Game Patch Live! Tap to Update.</div>

    <!-- Character Selector -->
    <div id="charModal">
        <div class="box">
            <h2 style="margin-top:0;">Hero Customization</h2>
            <label>Combat Class:</label>
            <select id="classSel">
                <option value="Warrior">Warrior (Heavy / Balanced)</option>
                <option value="Assassin">Assassin (Fast / Bleed)</option>
                <option value="Mage">Mage (Elemental / Healer)</option>
                <option value="Guard">Guard (Tank / Counter)</option>
            </select>
            <label>Innate Trait:</label>
            <select id="traitSel">
                <option value="Human">Human (Standard)</option>
                <option value="Vampire">Vampire (Sunburn / Blood Damage)</option>
                <option value="Werewolf">Werewolf (Beast Form / Claws)</option>
            </select>
            <button class="play-btn" onclick="enterWorld()">Enter World</button>
        </div>
    </div>

    <!-- HUD Elements -->
    <div id="hud" style="display:none;">
        <div id="hudName" style="color:#69f0ae; font-weight:bold;"></div>
        <div id="hudTrait" style="color:#ffd54f;"></div>
        <div>HP</div><div class="bar"><div id="hpFill"></div></div>
        <div>STAMINA</div><div class="bar"><div id="staFill"></div></div>
        <div id="hudWorld">Time: Day ☀️</div>
        <div style="font-size:10px; color:#aaa; margin-top:5px;">PC: [WASD] Move | [F] Attack<br>[Space] Parry | [Shift] Dodge | [E] Tech</div>
    </div>

    <div id="bossHud">
        <div style="font-size:12px; color:#ff8a80; font-weight:bold;">ROTWOOD BEHEMOTH (TIER 1 BOSS)</div>
        <div id="bossHpBar"><div id="bossHpFill"></div></div>
    </div>

    <div id="telegraphBanner"></div>

    <!-- Touch Controls -->
    <div id="dpad" style="display:none;">
        <div class="t-btn" id="btnUp">▲</div>
        <div class="t-btn" id="btnLeft">◀</div>
        <div class="t-btn" id="btnDown">▼</div>
        <div class="t-btn" id="btnRight">▶</div>
    </div>

    <div id="actionCluster" style="display:none;">
        <div class="act-btn" id="btnParry">PARRY</div>
        <div class="act-btn" id="btnTech">TECH</div>
        <div class="act-btn" id="btnDodge">DODGE</div>
        <div class="act-btn" id="btnAttack">ATK</div>
    </div>

    <button id="btnCam" onclick="toggleCamera()">🎥</button>

    <div id="canvas3d"></div>

    <script>
        const socket = io();
        let myId = null, myData = null;
        const playerMeshes = {};
        let isFirstPerson = false;

        // Web Audio Synthesizer for Telegraph Sound Cues
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, duration) {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        function enterWorld() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            document.getElementById('charModal').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('dpad').style.display = 'grid';
            document.getElementById('actionCluster').style.display = 'grid';

            socket.emit('joinGame', {
                characterClass: document.getElementById('classSel').value,
                trait: document.getElementById('traitSel').value,
                subclass: 'Standard'
            });
        }

        // Three.js Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Day Sky
        scene.fog = new THREE.Fog(0x87ceeb, 20, 60);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 100);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('canvas3d').appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        scene.add(dirLight);

        // Voxel Grass Ground
        const ground = new THREE.Mesh(
            new THREE.BoxGeometry(100, 1, 100),
            new THREE.MeshLambertMaterial({ color: 0x388e3c })
        );
        ground.position.y = -0.5;
        scene.add(ground);

        // Voxel Gazebo (Shade for Vampires)
        const shelter = new THREE.Group();
        const roof = new THREE.Mesh(new THREE.BoxGeometry(12, 1, 12), new THREE.MeshLambertMaterial({ color: 0x4e342e }));
        roof.position.y = 5; shelter.add(roof);
        const pillar1 = new THREE.Mesh(new THREE.BoxGeometry(0.8, 5, 0.8), new THREE.MeshLambertMaterial({ color: 0x3e2723 }));
        pillar1.position.set(5, 2.5, 5); shelter.add(pillar1);
        const pillar2 = pillar1.clone(); pillar2.position.set(-5, 2.5, -5); shelter.add(pillar2);
        shelter.position.set(15, 0, 15);
        scene.add(shelter);

        // 3D Telegraph Indicator Mesh on Ground
        const telegraphRing = new THREE.Mesh(
            new THREE.RingGeometry(2.5, 3.2, 32),
            new THREE.MeshBasicMaterial({ color: 0x00e5ff, side: THREE.DoubleSide, transparent: true, opacity: 0 })
        );
        telegraphRing.rotation.x = Math.PI / 2;
        telegraphRing.position.y = 0.05;
        scene.add(telegraphRing);

        // Boss Model (Voxel Rotwood Behemoth)
        const bossGroup = new THREE.Group();
        const bossBody = new THREE.Mesh(new THREE.BoxGeometry(3, 4.5, 2), new THREE.MeshLambertMaterial({ color: 0x2e1c0c }));
        bossBody.position.y = 2.25; bossGroup.add(bossBody);
        const bossHead = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), new THREE.MeshLambertMaterial({ color: 0x1b5e20 }));
        bossHead.position.y = 5.2; bossGroup.add(bossHead);
        scene.add(bossGroup);

        // Helper: Build Minecraft/Voxel Character Rig
        function createVoxelPlayer(p) {
            const charGroup = new THREE.Group();
            let skinColor = 0xd7ccc8;
            let torsoColor = 0x1565c0; // Default blue

            if (p.characterClass === 'Warrior') torsoColor = 0x78909c; // Steel
            if (p.characterClass === 'Assassin') torsoColor = 0x212121; // Black leather
            if (p.characterClass === 'Mage') torsoColor = 0x512da8; // Purple robes
            if (p.characterClass === 'Guard') torsoColor = 0x37474f; // Heavy plate

            if (p.trait === 'Vampire') skinColor = 0xf5f5f5;
            if (p.trait === 'Werewolf' && p.isTransformed) {
                skinColor = 0x4e342e;
                torsoColor = 0x3e2723;
            }

            // Head (0.6 x 0.6 x 0.6)
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), new THREE.MeshLambertMaterial({ color: skinColor }));
            head.position.y = 1.6; charGroup.add(head);

            // Torso (0.8 x 0.9 x 0.4)
            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.9, 0.4), new THREE.MeshLambertMaterial({ color: torsoColor }));
            torso.position.y = 0.85; charGroup.add(torso);

            // Left / Right Arm
            const armGeo = new THREE.BoxGeometry(0.25, 0.8, 0.25);
            const armMat = new THREE.MeshLambertMaterial({ color: torsoColor });
            const leftArm = new THREE.Mesh(armGeo, armMat); leftArm.position.set(-0.55, 0.8, 0); charGroup.add(leftArm);
            const rightArm = new THREE.Mesh(armGeo, armMat); rightArm.position.set(0.55, 0.8, 0); charGroup.add(rightArm);

            // Left / Right Leg
            const legGeo = new THREE.BoxGeometry(0.3, 0.8, 0.3);
            const legMat = new THREE.MeshLambertMaterial({ color: 0x1a237e });
            const leftLeg = new THREE.Mesh(legGeo, legMat); leftLeg.position.set(-0.22, 0.4, 0); charGroup.add(leftLeg);
            const rightLeg = new THREE.Mesh(legGeo, legMat); rightLeg.position.set(0.22, 0.4, 0); charGroup.add(rightLeg);

            charGroup.position.set(p.x, 0, p.z);
            charGroup.userData = { leftLeg, rightLeg, leftArm, rightArm, head };
            scene.add(charGroup);
            return charGroup;
        }

        // Network Sync
        socket.on('init', (data) => {
            myId = data.id; myData = data.players[myId];
            for (let id in data.players) playerMeshes[id] = createVoxelPlayer(data.players[id]);
            updateHUD();
        });

        socket.on('newPlayer', (p) => { playerMeshes[p.id] = createVoxelPlayer(p); });
        socket.on('playerMoved', (p) => {
            if (playerMeshes[p.id]) {
                playerMeshes[p.id].position.set(p.x, 0, p.z);
                playerMeshes[p.id].rotation.y = p.rotation;
            }
        });
        socket.on('playerUpdated', (p) => {
            if (p.id === myId) { myData = p; updateHUD(); }
            if (playerMeshes[p.id]) {
                scene.remove(playerMeshes[p.id]);
                playerMeshes[p.id] = createVoxelPlayer(p);
            }
        });
        socket.on('playerLeft', (id) => {
            if (playerMeshes[id]) { scene.remove(playerMeshes[id]); delete playerMeshes[id]; }
        });

        // Day/Night Sync
        socket.on('timeSync', ({ isDay, isFullMoon }) => {
            if (isDay) {
                scene.background.set(0x87ceeb); scene.fog.color.set(0x87ceeb);
                ambientLight.intensity = 0.6;
                document.getElementById('hudWorld').innerText = "Time: Day ☀️";
                // Vampire Sunburn check
                if (myData && myData.trait === 'Vampire') {
                    // Check if outside shelter (x: 10 to 20, z: 10 to 20)
                    const underShade = myData.x > 9 && myData.x < 21 && myData.z > 9 && myData.z < 21;
                    if (!underShade) {
                        myData.hp = Math.max(1, myData.hp - 2);
                        document.getElementById('hpFill').style.width = (myData.hp / myData.maxHp * 100) + '%';
                    }
                }
            } else {
                scene.background.set(0x050510); scene.fog.color.set(0x050510);
                ambientLight.intensity = 0.2;
                document.getElementById('hudWorld').innerText = isFullMoon ? "Time: FULL MOON 🌕 (Feral Werewolf)" : "Time: Night 🌙";
            }
        });

        // Boss Combat Handlers
        let activeTelegraph = null;
        let canDefend = false;

        socket.on('bossTelegraphStart', ({ type, duration }) => {
            activeTelegraph = type;
            canDefend = true;
            const banner = document.getElementById('telegraphBanner');
            banner.style.display = 'block';

            if (type === 'parry') {
                banner.innerText = "⚡ PALE BLUE: PARRY! [Space / Parry Btn]";
                banner.style.background = "#0288d1";
                telegraphRing.material.color.set(0x00e5ff);
                playTone(2200, 'sine', 0.25);
            } else if (type === 'dodge') {
                banner.innerText = "⚠️ AMBER YELLOW: DODGE! [Shift / Dodge Btn]";
                banner.style.background = "#f57f17";
                telegraphRing.material.color.set(0xffd600);
                playTone(180, 'sawtooth', 0.3);
            } else if (type === 'technique') {
                banner.innerText = "💀 CRIMSON RED: TECHNIQUE COUNTER! [E / Tech Btn]";
                banner.style.background = "#b71c1c";
                telegraphRing.material.color.set(0xff1744);
                playTone(3500, 'triangle', 0.4);
            }

            telegraphRing.material.opacity = 0.8;
            setTimeout(() => {
                banner.style.display = 'none';
                telegraphRing.material.opacity = 0;
            }, duration);
        });

        socket.on('bossStrike', () => {
            canDefend = false;
        });

        socket.on('bossDamaged', ({ hp, maxHp, staggered }) => {
            document.getElementById('bossHpFill').style.width = (hp / maxHp * 100) + '%';
            if (staggered) {
                bossGroup.rotation.z = 0.4;
                setTimeout(() => { bossGroup.rotation.z = 0; }, 1200);
            }
        });

        socket.on('versionCheck', (v) => {
            if (v !== "0.0.5") document.getElementById('updateBanner').style.display = 'block';
        });

        function updateHUD() {
            document.getElementById('hudName').innerText = `${myData.characterClass} (Lv.${myData.level})`;
            document.getElementById('hudTrait').innerText = `Trait: ${myData.trait} ${myData.isTransformed ? '[Transformed]' : ''}`;
            document.getElementById('hpFill').style.width = (myData.hp / myData.maxHp * 100) + '%';
            document.getElementById('staFill').style.width = myData.stamina + '%';
        }

        // Combat Actions (Parry, Dodge, Technique, Attack)
        let playerCombatState = 'idle'; // idle, parrying, dodging, tech
        function triggerDefend(actionType) {
            if (canDefend && activeTelegraph === actionType) {
                canDefend = false;
                socket.emit('defendSuccess', { action: actionType });
                playTone(1200, 'sine', 0.15); // Success ping
            } else {
                // Mistimed action flinch
                playerCombatState = 'flinch';
                setTimeout(() => { playerCombatState = 'idle'; }, 400);
            }
        }

        function triggerAttack() {
            socket.emit('attackBoss');
            playTone(400, 'square', 0.1);
        }

        // Input Bindings (PC + Touch)
        window.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'q') triggerDefend('parry');
            if (e.key === 'Shift') triggerDefend('dodge');
            if (e.key === 'e') triggerDefend('technique');
            if (e.key === 'f') triggerAttack();
            if (e.key === 't') socket.emit('toggleWerewolf');
        });

        document.getElementById('btnParry').onclick = () => triggerDefend('parry');
        document.getElementById('btnDodge').onclick = () => triggerDefend('dodge');
        document.getElementById('btnTech').onclick = () => triggerDefend('technique');
        document.getElementById('btnAttack').onclick = triggerAttack;

        // Mobile D-Pad & PC Movement
        let keys = { w: false, s: false, a: false, d: false };
        window.addEventListener('keydown', (e) => { if (keys[e.key.toLowerCase()] !== undefined) keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', (e) => { if (keys[e.key.toLowerCase()] !== undefined) keys[e.key.toLowerCase()] = false; });

        function bindTouch(id, k) {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[k] = true; });
            el.addEventListener('touchend', (e) => { e.preventDefault(); keys[k] = false; });
        }
        bindTouch('btnUp', 'w'); bindTouch('btnDown', 's'); bindTouch('btnLeft', 'a'); bindTouch('btnRight', 'd');

        function toggleCamera() { isFirstPerson = !isFirstPerson; }

        // Render & Voxel Walking Animation Loop
        let walkClock = 0;
        function animate() {
            requestAnimationFrame(animate);

            if (myData && playerMeshes[myId]) {
                const mesh = playerMeshes[myId];
                let isMoving = false;

                if (keys.a) { mesh.rotation.y += 0.05; isMoving = true; }
                if (keys.d) { mesh.rotation.y -= 0.05; isMoving = true; }
                if (keys.w) {
                    mesh.position.x -= Math.sin(mesh.rotation.y) * 0.14;
                    mesh.position.z -= Math.cos(mesh.rotation.y) * 0.14;
                    isMoving = true;
                }
                if (keys.s) {
                    mesh.position.x += Math.sin(mesh.rotation.y) * 0.09;
                    mesh.position.z += Math.cos(mesh.rotation.y) * 0.09;
                    isMoving = true;
                }

                if (isMoving) {
                    walkClock += 0.2;
                    mesh.userData.leftLeg.rotation.x = Math.sin(walkClock) * 0.6;
                    mesh.userData.rightLeg.rotation.x = -Math.sin(walkClock) * 0.6;
                    mesh.userData.leftArm.rotation.x = -Math.sin(walkClock) * 0.6;
                    mesh.userData.rightArm.rotation.x = Math.sin(walkClock) * 0.6;
                    socket.emit('move', { x: mesh.position.x, z: mesh.position.z, rotation: mesh.rotation.y });
                } else {
                    mesh.userData.leftLeg.rotation.x = 0;
                    mesh.userData.rightLeg.rotation.x = 0;
                    mesh.userData.leftArm.rotation.x = 0;
                    mesh.userData.rightArm.rotation.x = 0;
                }

                // Camera follow
                if (isFirstPerson) {
                    camera.position.set(mesh.position.x, 1.6, mesh.position.z);
                    camera.rotation.y = mesh.rotation.y + Math.PI;
                } else {
                    camera.position.x = mesh.position.x + Math.sin(mesh.rotation.y) * 5;
                    camera.position.z = mesh.position.z + Math.cos(mesh.rotation.y) * 5;
                    camera.position.y = 3.5;
                    camera.lookAt(mesh.position.x, 1.2, mesh.position.z);
                }
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
